name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    # policy.mjs addresses the repository and project board named in
    # .github/issue-management/config.json, both of which live in the upstream
    # organization, so anywhere else the validator answers 404 and reports red
    # on every pull request.
    if: github.repository == 'deepseek-ai/deepseek-harness'
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
