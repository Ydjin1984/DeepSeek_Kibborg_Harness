# Пресет агента `code`: стандартный кодирующий агент, представленный как Code Mode.
#
# Всё из `standard` здесь без изменений. Добавлена строка `tool-presentation`:
# вместо одного вызова инструмента на действие модель пишет программу TypeScript
# против сгенерированного SDK, а `run_code` выполняет её, поэтому последовательность,
# которая заняла бы пять обменов, становится одним.
#
# Сам реестр остаётся на плоскости хоста — его потребители это планировщик цикла
# агента и презентеры API-прокси — так что этот пресет владеет ПРЕДСТАВЛЕНИЕМ
# этого реестра только для своего агента. Нативные сессии работают рядом с этой
# в том же процессе, каждая видя собственный каталог.
#
# Этот файл — композиция ПЛОСКОСТИ АГЕНТА. Он подключается под контекстом области
# одного агента, поэтому каждый инструмент и раздел промпта, который он
# регистрирует, принадлежит только этой сессии. Хост-композиция
# (`base.cordis.yml` + `web.cordis.yml`) хранит всё, чем пресет владеть не должен:
# сами реестры, стек песочницы и подтверждений, персистентность и маршрут модели.
#
# Строка-сервис здесь ОБЯЗАНА находиться внутри группы с областью `isolate`.
# Без неё она публикуется в корневую область, где глобальна для процесса, а не
# для сессии, и вторая сессия, подключающая этот пресет, столкнётся с первой;
# `dsh-agent-presets` отклоняет это при подключении. `true` означает область
# уровня записи — один приватный экземпляр на смонтированную сессию, что и есть
# дефолт этого развёртывания. Общая метка вместо этого объединила бы один
# экземпляр между всеми сессиями, назвавшими пресет.

# ── идентичность ────────────────────────────────────────────────────────────

# Собственная персона пресета, заменяющая дефолтную персону развёртывания для
# этого агента. `{{model}}` и `{{cwd}}` разрешаются из собственного маршрута
# и рабочей области агента.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      Ты — кодирующий агент на основе модели {{model}}. Твоя рабочая директория — {{cwd}}.

      Всегда отвечай на русском языке, независимо от языка запроса.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── оболочка ────────────────────────────────────────────────────────────────

# `shell-env` остаётся в ХОСТ-композиции: `apps/cli/src/web.ts` внедряет его,
# чтобы публиковать `DSH_WEB_URL`/`DSH_WEB_MODE`, а хостовая строка, внедряющая
# сервис, и есть критерий принадлежности плоскости хоста — внедрение разрешается
# до появления любой сессии, поэтому по ней нет агента для привязки. За областью
# пресета эти переменные вообще не дошли бы до оболочки модели. Оба инструмента
# оболочки потребляют хост-реестр отсюда; их исполнители
# (`bash-sandbox`/`pwsh-sandbox`) тоже на плоскости хоста.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── файловая система ────────────────────────────────────────────────────────

# Обе строки регистрируются в хост-реестр `tools` и ничего не предоставляют,
# поэтому им не нужна область. Сервис `fs` и его политика остаются на хосте.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── фоновые задачи ──────────────────────────────────────────────────────────

# Только элементы управления, видимые модели. РЕЕСТР задач остаётся на
# плоскости хоста: его производители находятся вне любой области, которую мог бы
# создать этот файл, — `tool-bash` выше разрешает его через `ctx.get`, а область
# уровня записи здесь невидима ни одной соседней строке, поэтому
# `run_in_background` отвечал бы «фоновые задачи недоступны», пока эти элементы
# управления сидели в каталоге. Реестр и так привязан к владеющему агенту, так
# что один хост-экземпляр обслуживает каждую сессию. Что выбирает пресет — это
# может ли его агент собирать и останавливать фоновую работу вообще.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── навыки ──────────────────────────────────────────────────────────────────

# РЕЕСТР навыков живёт в хост-композиции и наслаивается по областям: эти строки
# регистрируются в ЕГО слой для ЭТОГО пресета, поэтому им не нужна область.
# `skill-filesystem` вносит обнаружение локальных корней для агентов этого
# пресета, а `tool-skill` даёт им каталог и загрузчик; объединённый каталог
# также несёт то, что развёртывание зарегистрировало глобально (репозиторные
# плагины).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── цели ────────────────────────────────────────────────────────────────────

# Только инструмент, видимый модели. СЕРВИС целей, его драйвер сессии и команда
# `/goal` остаются на плоскости хоста: Gateway обслуживает домен целей как
# Remote-эндпоинты, чей приёмник берётся из сгенерированного дескриптора,
# поэтому он разрешает `goals` на хосте, и область уровня записи здесь скрыла бы
# его. Реестр и так привязан к сессии, поэтому один хост-экземпляр обслуживает
# каждую сессию. Что выбирает пресет — это может ли его агент вызывать
# инструмент целей.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── режим планирования ──────────────────────────────────────────────────────

# Состояние плана по своей природе принадлежит агенту, поэтому область уровня
# записи здесь не обходной путь — это правильное время жизни.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              Ты в режиме планирования. Оставайся в нём, пока exit_plan_mode не выполнится успешно или пользователь не переключит режим сессии. Повелительная формулировка о внесении изменений означает спланировать реализацию, а не выполнить её. Согласие пользователя в разговоре — включая ответ, подтверждающий заданный тобой вопрос, — ничего не утверждает и не завершает режим планирования; впиши подтверждённое решение в план и отправь его через exit_plan_mode.

              Сначала исследуй. Используй неизменяющие чтения, поиски, статический анализ и проверки, чтобы обосновать план реальным репозиторием. Не редактируй и не создавай файлы, не меняй конфигурацию, не запускай форматтеры или генерацию кода, переписывающую отслеживаемые файлы, не коммить и не выполняй план иным образом. Предпочитай существующие функции и паттерны новой механике.

              Каталог инструментов остаётся прежним между режимами ради стабильности кэша запросов. Эти правила режима планирования имеют приоритет над любыми более поздними описаниями инструментов или указаниями, предлагающими использовать изменяющие инструменты; те остаются в списке, чтобы каталог инструментов не менялся. Не используй todo_write для отслеживания фазы планирования: он отслеживает реализацию после одобренного плана, а сам план принадлежит exit_plan_mode.

              Разрешай обнаруживаемые факты осмотром. Используй ask_user_question только для решений, принадлежащих пользователю, или существенной неоднозначности, которую осмотр разрешить не может. Не спрашивай пользователя, где находится код или как работает текущее поведение, если можешь выяснить это сам.

              Сделай план исчерпывающим по решениям: укажи цель и критерии успеха; сгруппируй изменения реализации по подсистемам; укажи изменения публичного API, схемы и потока данных; покрой крайние случаи, сценарии отказа, тесты, критерии приёмки и явные допущения. Пусть он будет достаточно кратким для ревью и достаточно подробным, чтобы другой инженер реализовал его без принятия проектных решений.

              Когда будешь готов, вызови exit_plan_mode с полным планом в markdown, начиная с заголовка # title. Сделай exit_plan_mode единственным и финальным вызовом инструмента в этом ответе ассистента: он представляет план на утверждение, а реализация начинается только позже, после утверждения. Не вставляй финальный план обычным ответом и не спрашивай «продолжать?» прозой или через ask_user_question. Если ревью отклонит план, учти замечания и представь его снова. Если канал ревью недоступен или прерван, оставайся в режиме планирования и попроси пользователя переключить режим вручную; не переходи к реализации.

# ── сжатие ──────────────────────────────────────────────────────────────────

# `compaction-basic` читает `toolResultPrune` через `ctx.get`, поэтому прунер
# должен разделять эту область, а не находиться вне её.
#
# `tokenMeter` намеренно НЕ в этой области: счётчик остаётся на плоскости ХОСТА,
# и строки здесь разрешают именно тот экземпляр. Он не принимает конфигурацию,
# привязывает каждый свёрнутый ход к Session и владеет единицами проекции
# контекстного счётчика, которые браузер читает для каждой сессии — за областью
# эти единицы появлялись бы и исчезали вместе с тем, какие пресеты смонтированы.
# Что выбирает пресет — это сжимается ли его агент вообще, чем и занимается
# `compaction-basic` ниже.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── делегирование и рабочие процессы ───────────────────────────────────────

# Реестр `subagents` и его бэкенды spawn/fork живут в ХОСТ-композиции: реестр —
# это синглтон процесса, чьи межсессионные запросы api-proxy обслуживает для
# браузера, а имя провайдера может быть зарегистрировано только один раз. Этот
# пресет вносит инструменты делегирования, которые разрешают тот хост-реестр.
#
# `workflows` устроен иначе — за пределами агента его никто не читает — поэтому
# все строки, которые до него добираются, разделяют одну область уровня записи
# здесь, а потребитель вне области разрешал бы хост-реестр, который этот пресет
# не наполняет.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Продакшн-dsh не ставит эти опциональные провайдеры. Установи
    # соответствующий Bundle в этом Профиле и перезапусти Хост, затем скопируй
    # этот пресет и убери `disabled` у соответствующей строки инструмента.
    # Наличие на хосте само по себе не даёт инструмент.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── остальные строки, видимые модели ────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Сервис `web` и его поисковый провайдер остаются в хост-композиции; только
# инструмент, видимый модели, принадлежит сессии.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── представление ───────────────────────────────────────────────────────────

# Code Mode только для этого агента. Строка ждёт хост-`codeRuntime`, а не
# предполагает его: развёртывание без TypeScript-рантайма проваливает этот
# пресет при подключении, называя этот id, а не при первом запросе.
- id: tool-presentation
  name: '@deepseek-ai/dsh-agent-tool-presentation'
  config:
    mode: code
