# Пресет агента `minimal`: композиция кодирующего агента с фиксированным
# промптом и двумя инструментами.
#
# Персона — это полный системный промпт, поэтому глобальная идентичность,
# веб-ориентация, указания по инструментам и более поздние слушатели сборки
# не могут добавить текст промпта. Снапшоты контекста среды выполнения для
# этого пресета отключены, и модель составляет только постоянную оболочку
# (`bash` на POSIX, `pwsh` на win32) и `str_replace_editor`. Сжатие контекста
# отсутствует.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: Ты — полезный ассистент-инженер-программист. Всегда отвечай на русском языке.
    complete: true
    includeRuntimeContext: false

# Реестр PTY — сервис, принадлежащий агенту, поэтому он живёт в области уровня
# записи. Бэкенд по-прежнему потребляет хост-политику песочницы и реализацию
# подпроцессов, а инструмент регистрируется в каталог этого агента. На хост
# монтируется ровно один стек оболочек: bash-стек отключается на win32, а его
# близнец pwsh — на POSIX, зеркаля одноразовые строки оболочки.
- id: persistent-shell
  name: cordis:group
  group: true
  isolate:
    terminals: true
  config:
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000

    - id: persistent-bash
      name: '@deepseek-ai/dsh-tool-bash-persistent'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Запуск команд в оболочке bash
          * При вызове этого инструмента содержимое параметра "command" НЕ нужно экранировать XML.
          * Через этот инструмент у тебя нет доступа в интернет.
          * У тебя есть доступ к зеркалу распространённых пакетов linux и python через apt и pip.
          * Состояние сохраняется между вызовами команд и обсуждениями с пользователем.
          * Чтобы просмотреть конкретный диапазон строк файла, например строки 10-25, попробуй 'sed -n 10,25p /path/to/the/file'.
          * Избегай команд, которые могут выдать очень большой объём вывода.
          * Запускай долгоживущие команды в фоне, например 'sleep 10 &' или запускай сервер в фоне.

    - id: terminal-pwsh
      name: '@deepseek-ai/dsh-terminal-bash'
      disabled: !!js process.platform !== 'win32'
      config:
        shellDialect: pwsh
        timeoutMs: 300000

    - id: persistent-pwsh
      name: '@deepseek-ai/dsh-tool-pwsh-persistent'
      disabled: !!js process.platform !== 'win32'
      config:
        timeoutMs: 300000
        description: |-
          Запуск команд в оболочке PowerShell
          * При вызове этого инструмента содержимое параметра "command" НЕ нужно экранировать XML.
          * Через этот инструмент у тебя нет доступа в интернет.
          * Состояние сохраняется между вызовами команд и обсуждениями с пользователем.
          * Используй нативные пути Windows (C:\...) и переменные $env:NAME; это PowerShell, а не bash.
          * Избегай команд, которые могут выдать очень большой объём вывода.
          * Запускай долгоживущие команды в фоне, например 'Start-Job' или запускай сервер через Start-Process.

# Голая локальная файловая система заменяет хост-провайдера в песочнице только
# для этого пресета. Редактор разделяет ту же область и требует абсолютные пути.
- id: filesystem
  name: cordis:group
  group: true
  isolate:
    fs: true
  config:
    - id: fs-local
      name: '@deepseek-ai/dsh-fs-local'
      config:
        cwd: !!js process.env.DSH_CWD ?? process.cwd()

    - id: str-replace-editor
      name: '@deepseek-ai/dsh-tool-str-replace-editor'
      config:
        maxOutputChars: 16000
